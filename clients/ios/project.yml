# XcodeGen spec for the iOS app (generate with `xcodegen generate`).
# The app target is a thin shell around the LibarrieKit and LibarrieUI
# package products in this directory.
name: Libarrie
options:
  bundleIdPrefix: app.libarrie
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  Libarrie:
    path: .
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    # Set your team to run on a device: DEVELOPMENT_TEAM: ABCDE12345
targets:
  Libarrie:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes: ["Info.plist"]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.libarrie.ios
        INFOPLIST_FILE: App/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
    dependencies:
      - package: Libarrie
        product: LibarrieKit
      - package: Libarrie
        product: LibarrieUI
