# Builds the release images (server/release) on both architectures. The
# build itself enforces DESIGN.md section 3: Erlang/OTP is built without any
# GCC runtime, every file is attributed in a CycloneDX SBOM, the license
# gate fails on GPL-family or unknown licenses, and smoke checks boot each
# program from the shell-less root. The SBOMs are kept as artifacts.
name: release-images

on:
  push:
    paths:
      - "server/**"
      - "clients/web/static/**"
      - "database/migrations/**"
      - ".github/workflows/release-images.yml"
  pull_request:
    paths:
      - "server/**"
      - "clients/web/static/**"
      - "database/migrations/**"
      - ".github/workflows/release-images.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  images:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: API image (with license gate and smoke checks)
        run: docker buildx build -f server/release/Dockerfile --target api --load -t libarrie-api:ci .
      - name: Worker image
        run: docker buildx build -f server/release/Dockerfile --target worker --load -t libarrie-worker:ci .
      - name: SBOM
        run: docker buildx build -f server/release/Dockerfile --target sbom --output type=local,dest=out/sbom .
      - name: No shell or GCC runtime in the images
        run: |
          for image in libarrie-api:ci libarrie-worker:ci; do
            id=$(docker create "$image")
            if docker export "$id" | tar -t | grep -E '(^|/)(sh|bash|busybox)$|libstdc\+\+|libgcc_s'; then
              echo "$image contains a shell or a GCC runtime"; exit 1
            fi
            docker rm "$id" >/dev/null
          done
      - name: Migrations run from the release image
        run: |
          docker run -d --name pg -e POSTGRES_USER=libarrie -e POSTGRES_PASSWORD=libarrie -e POSTGRES_DB=libarrie pgvector/pgvector:pg17
          for i in $(seq 1 30); do docker exec pg pg_isready -U libarrie && break; sleep 2; done
          docker run --rm --network container:pg \
            -e DATABASE_URL=postgres://libarrie:libarrie@localhost:5432/libarrie \
            libarrie-api:ci migrate
      - uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ matrix.arch }}
          path: out/sbom/sbom.cdx.json
