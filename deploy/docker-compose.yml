# Development stack only (DESIGN.md section 15). Stock upstream images are
# referenced, not rebuilt or redistributed. The object store is RustFS
# (Apache-2.0); MinIO and Garage are AGPL and excluded.
name: libarrie-dev

services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: libarrie
      POSTGRES_PASSWORD: libarrie
      POSTGRES_DB: libarrie
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "libarrie"]
      interval: 2s
      retries: 30

  objectstore:
    image: rustfs/rustfs:1.0.6
    environment:
      RUSTFS_ADDRESS: ":8333"
      RUSTFS_ACCESS_KEY: libarrie-dev-access
      RUSTFS_SECRET_KEY: libarrie-dev-secret
      RUSTFS_CONSOLE_ENABLE: "false"
      RUSTFS_CORS_ALLOWED_ORIGINS: http://localhost:8080
    ports:
      - "8333:8333"
    volumes:
      - objects:/data

volumes:
  pgdata:
  objects:
