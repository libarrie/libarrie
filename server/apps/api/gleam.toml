name = "libarrie_api"
version = "0.1.0"
description = "Libarrie core HTTP API"
licences = ["Apache-2.0"]

[dependencies]
gleam_stdlib = ">= 1.0.0 and < 2.0.0"
gleam_crypto = ">= 1.6.0 and < 2.0.0"
gleam_erlang = ">= 1.3.0 and < 2.0.0"
gleam_http = ">= 4.5.0 and < 5.0.0"
gleam_httpc = ">= 5.0.0 and < 6.0.0"
gleam_json = ">= 3.1.0 and < 4.0.0"
gleam_otp = ">= 1.3.0 and < 2.0.0"
gleam_time = ">= 1.11.0 and < 2.0.0"
argv = ">= 1.0.0 and < 2.0.0"
envoy = ">= 1.0.0 and < 2.0.0"
mist = ">= 6.0.0 and < 7.0.0"
pog = ">= 4.1.0 and < 5.0.0"
wisp = ">= 2.2.0 and < 3.0.0"
youid = ">= 1.6.0 and < 2.0.0"
libarrie_database = { path = "../../packages/database" }
libarrie_jobs = { path = "../../packages/jobs" }
libarrie_integrations = { path = "../../packages/integrations" }
libarrie_domain = { path = "../../packages/domain" }
libarrie_web = { path = "../../packages/web" }
libarrie_mcp = { path = "../../packages/mcp" }

[dev_dependencies]
gleeunit = ">= 1.0.0 and < 2.0.0"
simplifile = ">= 2.7.0 and < 3.0.0"
lustre = ">= 5.7.0 and < 6.0.0"
libarrie_worker = { path = "../worker" }
gleam_mcp = { git = "https://github.com/thedadams/gleam-mcp.git", ref = "f8c429c7362aa5dbcb86cda816633dd00e1da414" }
